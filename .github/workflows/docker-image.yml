name: AIML1_Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Step 1: Log in to DockerHub
    - name: Log in to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # Step 2: Build the Docker image
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    # Step 3: Tag the image with a version or latest tag (e.g., :latest or :v1.0.0)
    - name: Tag the Docker image
      run: docker tag my-image-name:$(date +%s) my-dockerhub-username/my-image-name:latest

    # Step 4: Push the Docker image to DockerHub
    - name: Push Docker image to DockerHub
      run: docker push my-dockerhub-username/my-image-name:latest
