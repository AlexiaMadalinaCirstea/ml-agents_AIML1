name: AIML1_Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Step 1: Log in to DockerHub using GitHub secrets
    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

    # Step 2: Build the Docker image
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag aiml1_docker/my-image-name:$(date +%s)

    # Step 3: Tag the image with 'latest' or any other custom version tag
    - name: Tag the Docker image
      run: docker tag aiml1_docker/my-image-name:$(date +%s) aiml1_docker/my-image-name:latest

    # Step 4: Push the Docker image to DockerHub
    - name: Push Docker image to DockerHub
      run: docker push aiml1_docker/my-image-name:latest
